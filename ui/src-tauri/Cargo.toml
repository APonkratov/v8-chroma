[package]
name = "v8-chroma-app"
version = "0.5.1"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/APonkratov/v8-chroma"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
v8-chroma-core = { path = "../.." }
anyhow = "1"
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
tray-icon = "=0.25.1"
fs2 = "0.4"

[[bin]]
name = "v8-chroma"
path = "src/main.rs"
