[package]
name = "v8-chroma-core"
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/APonkratov/v8-chroma"

[[bin]]
name = "v8-chroma-cli"
path = "src/main.rs"
required-features = ["windows-engine"]

[features]
default = ["windows-engine"]
windows-engine = ["dep:chrono", "dep:sha2", "dep:wmi"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
chrono = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
wmi = { version = "0.18.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug",
  "Win32_System_ProcessStatus",
  "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop",
  "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"


[workspace]
members = ["ui/src-tauri"]
default-members = ["."]
resolver = "3"
