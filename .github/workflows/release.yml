name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build Windows x64 executables
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: x86_64-pc-windows-msvc
          native: 'true'
      - name: Stable/RC tag and version gate
        shell: bash
        run: python scripts/release_checks.py --tag "$RELEASE_TAG"
      - name: CMake, native, protocol, UI and Rust checks
        run: python scripts/build.py check
      - name: Build and verify executables
        # Git Bash prepends its Unix link.exe ahead of the MSVC linker.
        shell: pwsh
        run: python scripts/build.py release --tag "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    name: Publish stable or RC release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-windows-x64
          path: release
      - name: Publish executable files without a ZIP
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          sha256sum --check SHA256SUMS.txt
          flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Темы оформления конфигуратора 1С для Windows x64.

          - `v8-chroma.exe` — интерфейс, трей и общее применение темы, значков и шрифтов интерфейса и редактора.
          - `v8-chroma-cli.exe` — отдельный CLI; скачивать оба EXE необязательно.
          - ZIP и соседние DLL для работы не нужны. Для GUI требуется установленный WebView2 Runtime.
          - Доступны установленные шрифты, размер редактора и программные лигатуры поддерживающих их семейств.
          - Шрифт интерфейса по умолчанию — Segoe UI Variable Small; доступны другие установленные семейства и возврат «Как в 1С».
          - Меню, дерево и панели обновляются без перезапуска. Проверены 8.3.26.1656, 8.3.27.2325, 8.5.1.1529 и 8.5.4.1878 x64.
          - Настройки мигрируют с резервной копией. При медленном запуске Конфигуратора применение шрифта можно повторить после открытия главного окна.
          - Совместимость определяется API платформы; проверенные версии и ограничения описаны в README.
          - При обновлении движка уже открытые Конфигураторы нужно штатно перезапустить.

          Сверьте SHA-256 с `SHA256SUMS.txt`. При дальнейшей передаче приложения сохраняйте
          `LICENSE` и `THIRD-PARTY-NOTICES.txt`. Подробнее об установке и ограничениях — в README.
          NOTES
          gh release create "$RELEASE_TAG" \
            v8-chroma.exe v8-chroma-cli.exe LICENSE THIRD-PARTY-NOTICES.txt SHA256SUMS.txt \
            --verify-tag --title "v8-chroma ${RELEASE_TAG#v}" --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
