name: Setup build dependencies
description: Rust, Python and optional Windows CMake/MSVC tools
inputs:
  target:
    description: Rust target triple for this runner
    required: true
  native:
    description: Install the Windows x64 native/desktop build tools
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: 3.14.5
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      with:
        toolchain: 1.97.1
        targets: ${{ inputs.target }}
        components: rustfmt, clippy
    - name: Fetch locked Rust dependencies
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.target }}
      run: cargo +1.97.1 fetch --locked --target "$RUST_TARGET"
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      if: inputs.native == 'true'
      with:
        node-version: 24.13.0
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      if: inputs.native == 'true'
      with:
        arch: x64
    - name: CMake and Ninja
      if: inputs.native == 'true'
      shell: bash
      run: python -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt
